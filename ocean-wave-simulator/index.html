<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Wave Simulator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06121f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8f1f8; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #ui { position: fixed; top: 14px; left: 14px; width: 250px; box-sizing: border-box;
    background: rgba(8, 20, 34, .72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35); user-select: none; }
  #ui.collapsed .body { display: none; }
  #ui h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; }
  #ui h1 button { background: none; border: 1px solid rgba(255,255,255,.2); color: #cfe0ee; border-radius: 6px;
    font-size: 11px; padding: 2px 7px; cursor: pointer; }
  .body { margin-top: 10px; }
  label { display: block; font-size: 12px; margin: 9px 0 2px; color: #b9cbda; }
  label span { float: right; color: #e8f1f8; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 2px 0 0; accent-color: #5fb3e6; }
  .row { display: flex; gap: 6px; margin-top: 12px; }
  .row button { flex: 1; background: #1f5f8f; border: none; color: #fff; font-size: 12px; font-weight: 600;
    padding: 8px 4px; border-radius: 8px; cursor: pointer; transition: background .15s; }
  .row button:hover { background: #2a7cb8; }
  .row button.secondary { background: rgba(255,255,255,.1); }
  .row button.secondary:hover { background: rgba(255,255,255,.18); }
  .stats { display: flex; justify-content: space-between; font-size: 11px; color: #9fb4c6; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 11px; color: #8ea3b5; margin: 10px 0 0; line-height: 1.45; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; font-size: 15px; line-height: 1.5; }
  @media (max-width: 520px) { #ui { width: calc(100% - 28px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Ocean Wave Simulator <button id="toggle">hide</button></h1>
  <div class="body">
    <label>Wave height <span id="vHeight"></span></label>
    <input type="range" id="height" min="0" max="2" step="0.01" value="1">
    <label>Choppiness <span id="vChop"></span></label>
    <input type="range" id="chop" min="0" max="1" step="0.01" value="0.6">
    <label>Wavelength <span id="vLen"></span></label>
    <input type="range" id="len" min="0.4" max="2.2" step="0.01" value="1">
    <label>Wind direction <span id="vWind"></span></label>
    <input type="range" id="wind" min="0" max="360" step="1" value="35">
    <label>Sun elevation <span id="vSun"></span></label>
    <input type="range" id="sun" min="2" max="75" step="1" value="26">
    <div class="row">
      <button id="drop">Drop barrel</button>
      <button id="drop10">Drop 10</button>
      <button id="clear" class="secondary">Clear</button>
    </div>
    <div class="stats"><span id="count">0 barrels</span><span id="fps">– fps</span></div>
    <p class="hint">Click the water to drop a barrel · Drag to orbit · Scroll / pinch to zoom · Space drops a barrel</p>
  </div>
</div>
<div id="err">Sorry, this page needs a browser with WebGL2 support.</div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  document.getElementById('err').style.display = 'flex';
  document.getElementById('ui').style.display = 'none';
  throw new Error('WebGL2 not available');
}

const NW = 8;                 // number of Gerstner waves
const MAX_BARRELS = 64;
const G = 9.81;

// ---------------------------------------------------------------------------
// Shaders
// ---------------------------------------------------------------------------
const COMMON_GLSL = `
uniform vec3 uSunDir, uSunColor, uZenith, uHorizon, uCamPos;
uniform float uSunIntensity, uTime, uFogDensity, uExposure;

vec3 skyColor(vec3 d) {
  float t = clamp(d.y, 0.0, 1.0);
  vec3 col = mix(uHorizon, uZenith, pow(t, 0.4));
  float sd = max(dot(d, uSunDir), 0.0);
  col += uSunColor * uSunIntensity * (pow(sd, 12.0) * 0.05 + pow(sd, 150.0) * 0.25);
  return col;
}
vec3 tonemap(vec3 c) {
  c *= uExposure;
  c = clamp((c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14), 0.0, 1.0);
  return pow(c, vec3(1.0 / 2.2));
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.13 + 7.7; a *= 0.5; }
  return v;
}
vec3 applyFog(vec3 col, vec3 world) {
  vec3 dv = world - uCamPos;
  float dist = length(dv);
  float f = 1.0 - exp(-dist * uFogDensity);
  vec3 hd = normalize(vec3(dv.x, 0.0, dv.z) + vec3(1e-4, 0.0, 0.0));
  vec3 fc = skyColor(normalize(vec3(hd.x, 0.03, hd.z)));
  return mix(col, fc, f);
}
`;

const WAVE_GLSL = `
#define NW ${NW}
uniform vec4 uWaveA[NW]; // dir.x, dir.y, amplitude, k
uniform vec4 uWaveB[NW]; // omega, Q, phase, -
void gerstner(vec2 p, float t, out vec3 disp, out vec3 dPdx, out vec3 dPdz) {
  disp = vec3(0.0);
  dPdx = vec3(1.0, 0.0, 0.0);
  dPdz = vec3(0.0, 0.0, 1.0);
  for (int i = 0; i < NW; i++) {
    vec2 D = uWaveA[i].xy;
    float A = uWaveA[i].z, k = uWaveA[i].w;
    float w = uWaveB[i].x, Q = uWaveB[i].y, ph = uWaveB[i].z;
    float f = k * dot(D, p) - w * t + ph;
    float s = sin(f), c = cos(f);
    disp += vec3(Q * A * D.x * c, A * s, Q * A * D.y * c);
    dPdx += vec3(-Q * A * k * D.x * D.x * s, A * k * D.x * c, -Q * A * k * D.x * D.y * s);
    dPdz += vec3(-Q * A * k * D.x * D.y * s, A * k * D.y * c, -Q * A * k * D.y * D.y * s);
  }
}
`;

const SKY_VS = `#version 300 es
out vec2 vNdc;
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  vNdc = p;
  gl_Position = vec4(p, 0.9999, 1.0);
}`;

const SKY_FS = `#version 300 es
precision highp float;
${COMMON_GLSL}
uniform mat4 uInvVP;
in vec2 vNdc;
out vec4 fragColor;
void main() {
  vec4 wp = uInvVP * vec4(vNdc, 1.0, 1.0);
  vec3 dir = normalize(wp.xyz / wp.w - uCamPos);
  vec3 col;
  if (dir.y >= 0.0) {
    col = skyColor(dir);
    float sd = dot(dir, uSunDir);
    float discI = mix(2.5, 12.0, smoothstep(0.05, 0.45, uSunDir.y));
    col += uSunColor * uSunIntensity * discI * smoothstep(0.9993, 0.9997, sd);
    // faint high clouds
    vec2 cp = dir.xz / max(dir.y, 0.05) * 0.35;
    float cl = fbm(cp + uTime * 0.005);
    cl = smoothstep(0.62, 0.9, cl) * smoothstep(0.0, 0.3, dir.y);
    vec3 cloudCol = mix(uHorizon, uSunColor * 0.5 + 0.5, 0.5) * (0.5 + 0.5 * uSunIntensity / 3.2);
    col = mix(col, cloudCol, cl * 0.35);
  } else {
    col = skyColor(vec3(dir.x, 0.0, dir.z));
  }
  fragColor = vec4(tonemap(col), 1.0);
}`;

const WATER_VS = `#version 300 es
${WAVE_GLSL}
in vec2 aPos;
uniform mat4 uVP;
uniform float uTime;
out vec3 vWorld;
out vec3 vNormal;
out vec2 vP0;
out float vJ;
out float vHeight;
void main() {
  vec3 d, dx, dz;
  gerstner(aPos, uTime, d, dx, dz);
  vec3 P = vec3(aPos.x, 0.0, aPos.y) + d;
  vWorld = P;
  vNormal = normalize(cross(dz, dx));
  vJ = dx.x * dz.z - dx.z * dz.x;
  vP0 = aPos;
  vHeight = d.y;
  gl_Position = uVP * vec4(P, 1.0);
}`;

const WATER_FS = `#version 300 es
precision highp float;
${COMMON_GLSL}
uniform vec3 uDeepColor, uShallowColor;
uniform float uMaxAmp, uDetail, uFoamStart;
uniform vec4 uBarrels[${MAX_BARRELS}]; // x, z, radius, presence
uniform int uBarrelCount;
in vec3 vWorld;
in vec3 vNormal;
in vec2 vP0;
in float vJ;
in float vHeight;
out vec4 fragColor;

void main() {
  vec3 N = normalize(vNormal);
  float t = uTime;
  vec2 p = vP0;
  float dist = length(vWorld - uCamPos);

  // small-scale ripples for sparkle (analytic normal perturbation)
  vec2 dn = vec2(0.0);
  float wobble = 0.35 + 1.3 * fbm(p * 0.35 + t * 0.06);
  { vec2 D = normalize(vec2(0.7, 0.4));  float k = 5.0;  dn += D * k * 0.010 * cos(k * dot(D, p) - t * 4.5 + wobble * 2.0); }
  { vec2 D = normalize(vec2(-0.3, 0.9)); float k = 9.0;  dn += D * k * 0.0045 * cos(k * dot(D, p) - t * 6.5 + 1.3 - wobble); }
  { vec2 D = normalize(vec2(0.9, -0.5)); float k = 15.0; dn += D * k * 0.0022 * cos(k * dot(D, p) - t * 8.5 + 2.1 + wobble * 3.0); }
  { vec2 D = normalize(vec2(-0.8, -0.6)); float k = 24.0; dn += D * k * 0.0011 * cos(k * dot(D, p) - t * 10.5 + 0.7); }
  float detail = uDetail * exp(-dist * 0.02) * wobble;
  N = normalize(N + vec3(-dn.x, 0.0, -dn.y) * detail);

  vec3 V = normalize(uCamPos - vWorld);
  float NdV = max(dot(N, V), 0.0);
  vec3 R = reflect(-V, N);
  R.y = max(R.y, 0.02);
  R = normalize(R);
  vec3 refl = skyColor(R);
  float fres = 0.02 + 0.98 * pow(1.0 - NdV, 5.0);

  vec3 sun = uSunColor * uSunIntensity;
  float NdL = max(dot(N, uSunDir), 0.0);
  float h = clamp(vHeight / max(uMaxAmp, 0.05) * 0.5 + 0.5, 0.0, 1.0);

  // water body: ambient + diffuse scattering + backlit subsurface through crests
  vec3 ambient = mix(uHorizon, uZenith, 0.6) * 0.8;
  vec3 body = mix(uDeepColor, uShallowColor, h * 0.35) * (ambient + sun * NdL * 0.3);
  float back = clamp(dot(V, -uSunDir) * 0.5 + 0.5, 0.0, 1.0);
  float sss = pow(back, 4.0) * smoothstep(0.35, 1.0, h) * (0.3 + 0.7 * NdL) * (1.0 - fres);
  body += uShallowColor * sun * sss * 0.22;

  // sun specular: sharp highlight plus wider glitter, roughened with distance to avoid aliasing
  vec3 H = normalize(uSunDir + V);
  float NdH = max(dot(N, H), 0.0);
  float rough = 1.0 / (1.0 + dist * 0.035);
  vec3 spec = sun * (pow(NdH, 900.0 * rough) * 2.2 * rough + pow(NdH, 60.0 * rough) * 0.08);
  spec *= 0.06 + 0.94 * fres / 0.98; // fresnel-weighted

  vec3 col = mix(body, refl, fres) + spec;

  // foam: breaking crests (Jacobian) + barrel wakes
  float n1 = fbm(vWorld.xz * 1.4 + t * 0.15);
  float n2 = noise(vWorld.xz * 7.0 - t * 0.5);
  float foam = smoothstep(uFoamStart, uFoamStart - 0.45, vJ) * (0.35 + 0.9 * n1) * (0.7 + 0.5 * n2);
  float shade = 0.0;
  for (int i = 0; i < ${MAX_BARRELS}; i++) {
    if (i >= uBarrelCount) break;
    vec4 b = uBarrels[i];
    float d = distance(vWorld.xz, b.xy);
    float ring = smoothstep(b.z * 2.4, b.z * 1.0, d);
    foam += ring * b.w * 0.6 * (0.3 + 0.7 * noise(vWorld.xz * 4.0 + t * 0.8));
    shade += smoothstep(b.z * 1.6, b.z * 0.5, d) * b.w * 0.7;
  }
  foam = clamp(foam, 0.0, 1.0);
  shade = clamp(shade, 0.0, 1.0);
  col *= 1.0 - 0.35 * shade;
  vec3 foamCol = vec3(0.95) * (ambient * 0.9 + sun * (0.15 + 0.85 * NdL) * 0.4);
  col = mix(col, foamCol, foam * 0.9);

  col = applyFog(col, vWorld);
  fragColor = vec4(tonemap(col), 1.0);
}`;

const BARREL_VS = `#version 300 es
in vec3 aPos;
in vec3 aNormal;
in vec2 aUV;
in float aKind;
uniform mat4 uVP, uModel;
out vec3 vWorld;
out vec3 vNormal;
out vec2 vUV;
out float vKind;
void main() {
  vec4 w = uModel * vec4(aPos, 1.0);
  vWorld = w.xyz;
  vNormal = mat3(uModel) * aNormal;
  vUV = aUV;
  vKind = aKind;
  gl_Position = uVP * w;
}`;

const BARREL_FS = `#version 300 es
precision highp float;
${COMMON_GLSL}
uniform vec3 uTint;
uniform vec3 uDeepColor;
uniform float uWaterLevel;
in vec3 vWorld;
in vec3 vNormal;
in vec2 vUV;
in float vKind;
out vec4 fragColor;
void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorld);
  vec3 base;
  float metal = 0.0;
  if (vKind < 0.5) {
    float stave = fract(vUV.x * 12.0);
    float seam = smoothstep(0.0, 0.06, stave) * smoothstep(1.0, 0.94, stave);
    float idx = floor(vUV.x * 12.0);
    float grain = noise(vec2(vUV.y * 28.0 + idx * 7.3, idx * 3.1 + vUV.x * 60.0)) * 0.35
                + noise(vec2(vUV.y * 110.0, idx * 1.7)) * 0.15;
    vec3 wood = uTint * (0.62 + grain);
    wood = mix(wood * 0.3, wood, seam);
    float hoop = 0.0;
    hoop = max(hoop, 1.0 - smoothstep(0.024, 0.034, abs(vUV.y - 0.09)));
    hoop = max(hoop, 1.0 - smoothstep(0.024, 0.034, abs(vUV.y - 0.33)));
    hoop = max(hoop, 1.0 - smoothstep(0.024, 0.034, abs(vUV.y - 0.67)));
    hoop = max(hoop, 1.0 - smoothstep(0.024, 0.034, abs(vUV.y - 0.91)));
    vec3 metalCol = vec3(0.30, 0.31, 0.33) * (0.75 + 0.5 * noise(vUV * vec2(70.0, 25.0)));
    base = mix(wood, metalCol, hoop);
    metal = hoop;
  } else {
    vec2 c = vUV * 2.0 - 1.0;
    float plank = fract(c.x * 2.5 + 0.5);
    float seam = smoothstep(0.0, 0.07, plank) * smoothstep(1.0, 0.93, plank);
    float grain = noise(vec2(c.y * 22.0, floor(c.x * 2.5 + 0.5) * 5.0 + c.x * 3.0)) * 0.35;
    base = uTint * (0.58 + grain);
    base = mix(base * 0.3, base, seam);
    float rim = smoothstep(0.84, 0.9, length(c));
    base = mix(base, vec3(0.3, 0.31, 0.33), rim);
    metal = rim;
  }
  vec3 sun = uSunColor * uSunIntensity;
  float NdL = max(dot(N, uSunDir), 0.0);
  vec3 skyAvg = mix(uHorizon, uZenith, 0.5);
  vec3 down = uDeepColor * 3.0 * skyAvg;
  vec3 amb = mix(down, skyAvg, N.y * 0.5 + 0.5) * 0.7;
  vec3 col = base * (amb + sun * NdL * 0.42 * (1.0 - 0.5 * metal));
  vec3 H = normalize(uSunDir + V);
  float spec = pow(max(dot(N, H), 0.0), mix(28.0, 180.0, metal)) * mix(0.10, 0.9, metal);
  col += sun * spec * 0.6;
  vec3 R = reflect(-V, N);
  R.y = max(R.y, 0.0);
  float fr = pow(1.0 - max(dot(N, V), 0.0), 4.0);
  col += skyColor(normalize(R + vec3(0.0, 0.001, 0.0))) * (metal * 0.18 + 0.06 * fr);
  // wet band just above the water line
  float wet = 1.0 - smoothstep(0.0, 0.35, vWorld.y - uWaterLevel);
  col *= 1.0 - 0.35 * wet;
  col = applyFog(col, vWorld);
  fragColor = vec4(tonemap(col), 1.0);
}`;

const RING_VS = `#version 300 es
${WAVE_GLSL}
in vec2 aCorner;
in vec4 aInst; // x, z, t0, scale
uniform mat4 uVP;
uniform float uTime;
out vec2 vUV;
out float vAge;
out float vSeed;
void main() {
  float age = clamp((uTime - aInst.z) / 1.8, 0.0, 1.0);
  float size = aInst.w * (0.5 + 1.8 * age);
  vec2 xz = aInst.xy + aCorner * size;
  vec3 d, dx, dz;
  gerstner(xz, uTime, d, dx, dz);
  vec3 P = vec3(xz.x, 0.0, xz.y) + d + vec3(0.0, 0.06, 0.0);
  vUV = aCorner;
  vAge = age;
  vSeed = aInst.z;
  gl_Position = uVP * vec4(P, 1.0);
}`;

const RING_FS = `#version 300 es
precision highp float;
${COMMON_GLSL}
in vec2 vUV;
in float vAge;
in float vSeed;
out vec4 fragColor;
void main() {
  float r = length(vUV);
  float ringR = 0.12 + 0.82 * vAge;
  float w = 0.06 + 0.14 * vAge;
  float ring = smoothstep(w, 0.0, abs(r - ringR));
  float n = fbm(vUV * 5.0 + vSeed * 3.1);
  float inner = smoothstep(ringR, ringR * 0.15, r) * (1.0 - vAge) * 0.7;
  float a = clamp(ring * (0.55 + 0.7 * n) + inner * (0.5 + 0.7 * n), 0.0, 1.0) * (1.0 - vAge) * (1.0 - vAge);
  a *= smoothstep(1.0, 0.9, r);
  vec3 sun = uSunColor * uSunIntensity;
  vec3 col = vec3(0.95) * (mix(uHorizon, uZenith, 0.5) * 0.8 + sun * 0.35 * max(uSunDir.y, 0.1));
  fragColor = vec4(tonemap(col), a);
}`;

const POINT_VS = `#version 300 es
in vec3 aPos;
in float aLife;
uniform mat4 uVP;
uniform float uPointScale;
out float vLife;
void main() {
  vec4 c = uVP * vec4(aPos, 1.0);
  gl_Position = c;
  gl_PointSize = uPointScale * (0.10 + 0.12 * aLife) / max(c.w, 0.1);
  vLife = aLife;
}`;

const POINT_FS = `#version 300 es
precision highp float;
${COMMON_GLSL}
in float vLife;
out vec4 fragColor;
void main() {
  float d = length(gl_PointCoord - 0.5) * 2.0;
  float a = smoothstep(1.0, 0.25, d) * smoothstep(0.0, 0.3, vLife) * 0.85;
  vec3 sun = uSunColor * uSunIntensity;
  vec3 col = vec3(0.95) * (mix(uHorizon, uZenith, 0.5) * 0.9 + sun * 0.35 * max(uSunDir.y, 0.1));
  fragColor = vec4(tonemap(col), a);
}`;

// ---------------------------------------------------------------------------
// GL helpers
// ---------------------------------------------------------------------------
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log, src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('Shader compile failed: ' + log);
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link failed: ' + gl.getProgramInfoLog(p));
  const cache = {};
  return {
    p,
    u(name) { if (!(name in cache)) cache[name] = gl.getUniformLocation(p, name); return cache[name]; },
    a(name) { return gl.getAttribLocation(p, name); },
    use() { gl.useProgram(p); },
  };
}

const skyProg = program(SKY_VS, SKY_FS);
const waterProg = program(WATER_VS, WATER_FS);
const barrelProg = program(BARREL_VS, BARREL_FS);
const ringProg = program(RING_VS, RING_FS);
const pointProg = program(POINT_VS, POINT_FS);

// ---------------------------------------------------------------------------
// Math
// ---------------------------------------------------------------------------
const m4 = {
  perspective(fov, aspect, near, far) {
    const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
    return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
  },
  lookAt(eye, target, up) {
    let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;

    b.w[0] *= ad; b.w[1] *= ad; b.w[2] *= ad;
    b.p[0] += b.v[0] * dt; b.p[1] += b.v[1] * dt; b.p[2] += b.v[2] * dt;
    const dq = quat.multiply([b.w[0] * 0.5 * dt, b.w[1] * 0.5 * dt, b.w[2] * 0.5 * dt, 0], b.q);
    b.q = quat.normalize([b.q[0] + dq[0], b.q[1] + dq[1], b.q[2] + dq[2], b.q[3] + dq[3]]);
  }
  // barrel-barrel collisions (sphere approximation)
  const minD = 1.22, rest = 0.35;
  for (let i = 0; i < barrels.length; i++) for (let j = i + 1; j < barrels.length; j++) {
    const a = barrels[i], c = barrels[j];
    const dx = c.p[0] - a.p[0], dy = c.p[1] - a.p[1], dz = c.p[2] - a.p[2];
    const d = Math.hypot(dx, dy, dz);
    if (d >= minD || d < 1e-5) continue;
    const nx = dx / d, ny = dy / d, nz = dz / d, push = (minD - d) * 0.5;
    a.p[0] -= nx * push; a.p[1] -= ny * push; a.p[2] -= nz * push;
    c.p[0] += nx * push; c.p[1] += ny * push; c.p[2] += nz * push;
    const vn = (c.v[0] - a.v[0]) * nx + (c.v[1] - a.v[1]) * ny + (c.v[2] - a.v[2]) * nz;
    if (vn < 0) {
      const imp = -(1 + rest) * vn / 2;
      a.v[0] -= nx * imp; a.v[1] -= ny * imp; a.v[2] -= nz * imp;
      c.v[0] += nx * imp; c.v[1] += ny * imp; c.v[2] += nz * imp;
      a.w[0] += (Math.random() - 0.5) * imp; c.w[2] += (Math.random() - 0.5) * imp;
    }
  }
}

function update(dt) {
  // queued drops
  for (let i = dropQueue.length - 1; i >= 0; i--) {
    dropQueue[i].t -= dt;
    if (dropQueue[i].t <= 0) { spawnBarrel(dropQueue[i].x, dropQueue[i].z); dropQueue.splice(i, 1); }
  }
  // fixed-step physics
  const step = 1 / 120;
  let acc = Math.min(dt, 0.1), steps = 0;
  while (acc > 1e-6 && steps < 12) {
    const h = Math.min(step, acc);
    physicsStep(h);
    simTime += h; acc -= h; steps++;
  }
  // water level per barrel, splash detection, cleanup
  for (let i = barrels.length - 1; i >= 0; i--) {
    const b = barrels[i];
    waterAt(b.p[0], b.p[2], simTime, _w);
    b.wh = _w.h;
    const below = b.p[1] < b.wh + 0.45;
    if (below && !b.inWater) {
      const speed = Math.max(0, -b.v[1]);
      if (speed > 1.2) splash(b.p[0], b.p[2], clamp(speed / 11, 0.15, 1));
      else dripSplash(b.p[0], b.p[2], 0.3);
    }
    b.inWater = below;
    if (Math.abs(b.p[0]) > 160 || Math.abs(b.p[2]) > 160 || b.p[1] < -60) barrels.splice(i, 1);
  }
  // rings and spray
  for (let i = rings.length - 1; i >= 0; i--) if (simTime - rings[i].t0 > 1.8) rings.splice(i, 1);
  for (let i = spray.length - 1; i >= 0; i--) {
    const s = spray[i];
    s.v[1] -= G * dt;
    s.v[0] *= 1 - 0.6 * dt; s.v[2] *= 1 - 0.6 * dt;
    s.p[0] += s.v[0] * dt; s.p[1] += s.v[1] * dt; s.p[2] += s.v[2] * dt;
    s.life -= s.decay * dt;
    if (s.life <= 0 || s.p[1] < -maxAmp - 0.5) spray.splice(i, 1);
  }
}

// ---------------------------------------------------------------------------
// Camera & input
// ---------------------------------------------------------------------------
const SUN_AZ = 0.9;
const cam = { yaw: SUN_AZ + Math.PI + 0.35, pitch: 0.30, dist: 42, target: [0, 0, 0] };
let W = 1, H = 1, view, proj, viewProj, invViewProj, camPos = [0, 0, 0];
const FOV = 55 * Math.PI / 180;

function updateCamera() {
  const cp = Math.cos(cam.pitch);
  camPos = [Math.sin(cam.yaw) * cp * cam.dist, Math.sin(cam.pitch) * cam.dist + 0.5, Math.cos(cam.yaw) * cp * cam.dist];
  view = m4.lookAt(camPos, cam.target, [0, 1, 0]);
  proj = m4.perspective(FOV, W / H, 0.3, 1200);
  viewProj = m4.multiply(proj, view);
  invViewProj = m4.invert(viewProj);
}
function screenToWater(px, py) {
  const nx = px / canvas.clientWidth * 2 - 1, ny = 1 - py / canvas.clientHeight * 2;
  const a = m4.transform(invViewProj, [nx, ny, -1, 1]), b = m4.transform(invViewProj, [nx, ny, 1, 1]);
  const o = [a[0] / a[3], a[1] / a[3], a[2] / a[3]], f = [b[0] / b[3], b[1] / b[3], b[2] / b[3]];
  const d = [f[0] - o[0], f[1] - o[1], f[2] - o[2]];
  if (d[1] >= -1e-6) return null;
  const t = -o[1] / d[1];
  const hit = [o[0] + d[0] * t, 0, o[2] + d[2] * t];
  if (Math.hypot(hit[0], hit[2]) > 140) return null;
  return hit;
}

const pointers = new Map();
let dragMoved = 0, pinchDist = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
  dragMoved = 0;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (pointers.size === 1) {
    cam.yaw -= dx * 0.005;
    cam.pitch = clamp(cam.pitch + dy * 0.005, 0.06, 1.45);
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) cam.dist = clamp(cam.dist * pinchDist / d, 8, 140);
    pinchDist = d;
  }
});
function endPointer(e) {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (p && dragMoved < 6 && e.type === 'pointerup') {
    const hit = screenToWater(e.clientX, e.clientY);
    if (hit) spawnBarrel(hit[0], hit[2]);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 8, 140);
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); dropRandom(); }
});

function dropRandom(delay) {
  const ang = Math.random() * Math.PI * 2, rad = 3 + Math.random() * 10;
  const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
  if (delay) dropQueue.push({ x, z, t: delay }); else spawnBarrel(x, z);
}

// UI wiring
const $ = id => document.getElementById(id);
function bindSlider(id, key, labelId, fmt) {
  const el = $(id), label = $(labelId);
  const apply = () => { settings[key] = parseFloat(el.value); label.textContent = fmt(settings[key]); buildWaveTargets(); };
  el.addEventListener('input', apply);
  apply();
}
bindSlider('height', 'height', 'vHeight', v => v.toFixed(2) + '×');
bindSlider('chop', 'chop', 'vChop', v => Math.round(v * 100) + '%');
bindSlider('len', 'len', 'vLen', v => v.toFixed(2) + '×');
bindSlider('wind', 'wind', 'vWind', v => v + '°');
bindSlider('sun', 'sun', 'vSun', v => v + '°');
$('drop').addEventListener('click', () => dropRandom());
$('drop10').addEventListener('click', () => { for (let i = 0; i < 10; i++) dropRandom(0.05 + i * 0.18); });
$('clear').addEventListener('click', () => { barrels.length = 0; dropQueue.length = 0; });
$('toggle').addEventListener('click', () => {
  const ui = $('ui'); ui.classList.toggle('collapsed');
  $('toggle').textContent = ui.classList.contains('collapsed') ? 'show' : 'hide';
});

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (w !== canvas.width || h !== canvas.height) { canvas.width = w; canvas.height = h; }
  W = w; H = h;
  gl.viewport(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Lighting environment (derived from sun elevation)
// ---------------------------------------------------------------------------
const env = {};
function updateEnvironment() {
  const el = settings.sun * Math.PI / 180;
  env.sunDir = [Math.cos(el) * Math.sin(SUN_AZ), Math.sin(el), Math.cos(el) * Math.cos(SUN_AZ)];
  const e = Math.sin(el);
  const day = clamp(e / 0.45, 0, 1), dusk = clamp(e / 0.12, 0, 1);
  const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  env.sunColor = mix3(mix3([0.9, 0.25, 0.08], [1.0, 0.55, 0.22], dusk), [1.0, 0.96, 0.88], day);
  env.sunIntensity = lerp(1.4, 3.2, day) * lerp(0.6, 1.0, dusk);
  env.zenith = mix3(mix3([0.05, 0.06, 0.16], [0.09, 0.12, 0.32], dusk), [0.14, 0.34, 0.78], day);
  env.horizon = mix3(mix3([0.40, 0.15, 0.14], [0.85, 0.40, 0.16], dusk), [0.45, 0.64, 0.88], day);
  env.deep = mix3([0.012, 0.045, 0.085], [0.010, 0.055, 0.10], day);
  env.shallow = mix3([0.05, 0.30, 0.30], [0.06, 0.42, 0.40], day);
  env.exposure = lerp(1.0, 1.05, day);
  env.fog = lerp(0.0045, 0.0025, day);
}
function setCommon(prog) {
  gl.uniform3fv(prog.u('uSunDir'), env.sunDir);
  gl.uniform3fv(prog.u('uSunColor'), env.sunColor);
  gl.uniform3fv(prog.u('uZenith'), env.zenith);
  gl.uniform3fv(prog.u('uHorizon'), env.horizon);
  gl.uniform3fv(prog.u('uCamPos'), camPos);
  gl.uniform1f(prog.u('uSunIntensity'), env.sunIntensity);
  gl.uniform1f(prog.u('uTime'), simTime);
  gl.uniform1f(prog.u('uFogDensity'), env.fog);
  gl.uniform1f(prog.u('uExposure'), env.exposure);
}
function setWaves(prog) {
  gl.uniform4fv(prog.u('uWaveA'), waveA);
  gl.uniform4fv(prog.u('uWaveB'), waveB);
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const barrelUniform = new Float32Array(MAX_BARRELS * 4);
function render() {
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);

  // sky
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  skyProg.use();
  setCommon(skyProg);
  gl.uniformMatrix4fv(skyProg.u('uInvVP'), false, invViewProj);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);

  // barrels
  barrelProg.use();
  setCommon(barrelProg);
  gl.uniformMatrix4fv(barrelProg.u('uVP'), false, viewProj);
  gl.uniform3fv(barrelProg.u('uDeepColor'), env.deep);
  gl.bindVertexArray(barrelGeo.vao);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  let n = 0;
  for (const b of barrels) {
    gl.uniformMatrix4fv(barrelProg.u('uModel'), false, m4.fromQuatPos(b.q, b.p));
    gl.uniform3fv(barrelProg.u('uTint'), b.tint);
    gl.uniform1f(barrelProg.u('uWaterLevel'), b.wh);
    gl.drawElements(gl.TRIANGLES, barrelGeo.count, gl.UNSIGNED_INT, 0);
    if (n < MAX_BARRELS) {
      const presence = clamp(1 - Math.abs(b.p[1] - b.wh) / 1.4, 0, 1) * clamp(b.sub * 3, 0, 1);
      barrelUniform.set([b.p[0], b.p[2], 0.75, presence], n * 4);
      n++;
    }
  }
  gl.disable(gl.CULL_FACE);

  // water
  waterProg.use();
  setCommon(waterProg);
  setWaves(waterProg);
  gl.uniformMatrix4fv(waterProg.u('uVP'), false, viewProj);
  gl.uniform3fv(waterProg.u('uDeepColor'), env.deep);
  gl.uniform3fv(waterProg.u('uShallowColor'), env.shallow);
  gl.uniform1f(waterProg.u('uMaxAmp'), maxAmp);
  gl.uniform1f(waterProg.u('uDetail'), 0.45 + 0.55 * settings.chop);
  gl.uniform1f(waterProg.u('uFoamStart'), 1.0 - 0.72 * settings.chop);
  gl.uniform4fv(waterProg.u('uBarrels'), barrelUniform);
  gl.uniform1i(waterProg.u('uBarrelCount'), n);
  gl.bindVertexArray(waterVao);
  gl.drawElements(gl.TRIANGLES, waterIdx.length, gl.UNSIGNED_INT, 0);

  // splash rings and spray
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  if (rings.length) {
    const cnt = Math.min(rings.length, MAX_RINGS);
    for (let i = 0; i < cnt; i++) { const r = rings[rings.length - cnt + i]; ringInst.set([r.x, r.z, r.t0, r.scale], i * 4); }
    ringProg.use();
    setCommon(ringProg);
    setWaves(ringProg);
    gl.uniformMatrix4fv(ringProg.u('uVP'), false, viewProj);
    gl.bindVertexArray(ringVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, ringInstBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, ringInst, 0, cnt * 4);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, cnt);
  }
  if (spray.length) {
    const cnt = spray.length;
    for (let i = 0; i < cnt; i++) { const s = spray[i]; pointData[i * 4] = s.p[0]; pointData[i * 4 + 1] = s.p[1]; pointData[i * 4 + 2] = s.p[2]; pointData[i * 4 + 3] = s.life; }
    pointProg.use();
    setCommon(pointProg);
    gl.uniformMatrix4fv(pointProg.u('uVP'), false, viewProj);
    gl.uniform1f(pointProg.u('uPointScale'), H / (2 * Math.tan(FOV / 2)));
    gl.bindVertexArray(pointVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, pointBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pointData, 0, cnt * 4);
    gl.drawArrays(gl.POINTS, 0, cnt);
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
buildWaveTargets();
updateWaves(1);
for (let i = 0; i < 6; i++) dropRandom(0.4 + i * 0.35);

let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = 0;
const countEl = $('count'), fpsEl = $('fps');
function frame(now) {
  const realDt = Math.max(1e-3, (now - last) / 1000);
  const dt = Math.min(0.05, realDt);
  last = now;
  updateWaves(dt);
  update(dt);
  updateEnvironment();
  updateCamera();
  render();
  fpsAcc += realDt; fpsN++;
  if (now - fpsT > 500) {
    fpsEl.textContent = Math.round(fpsN / fpsAcc) + ' fps';
    countEl.textContent = barrels.length + (barrels.length === 1 ? ' barrel' : ' barrels');
    fpsAcc = 0; fpsN = 0; fpsT = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ocean = {
  barrels, spawnBarrel, settings, cam,
  waterAt: (x, z) => waterAt(x, z, simTime, {}),
  advance(seconds) { for (let s = 0; s < seconds; s += 1 / 60) update(1 / 60); },
};
</script>
</body>
</html>
